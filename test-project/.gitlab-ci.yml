image: node:20-alpine

variables:
  GREETING: "Hello from localflow"

greet:
  script:
    - echo "$GREETING"
    - node --version
    - echo "Current dir contents:"
    - ls -1

math:
  script:
    - echo "2 + 2 ="
    - node -e "console.log(2 + 2)"

fail-example:
  script:
    - echo "This job will fail on purpose"
    - exit 1
